name: Android Release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release version tag, for example v1.16
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          bash ./gradlew :lyrics-tool:assembleRelease \
            -x :lyrics-core:lintVitalAnalyzeRelease \
            -x :lyrics-core:lintVitalRelease \
            -x :lyrics-tool:lintVitalAnalyzeRelease \
            -x :lyrics-tool:lintVitalRelease

      - name: Build debug APK
        run: bash ./gradlew :lyrics-tool:assembleDebug

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lyrics-apk-${{ github.sha }}
          path: |
            lyrics-tool/build/outputs/apk/debug/lyrics-tool-debug.apk
            lyrics-tool/build/outputs/apk/release/lyrics-tool-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build-and-upload
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: lyrics-apk-${{ github.sha }}
          path: dist

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          name: Lyrics ${{ inputs.tag_name || github.ref_name }}
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          target_commitish: ${{ github.sha }}
          body: |
            > **Unsigned APK:** This package is not signed and cannot be installed as-is or used to update an installed app. Configure release signing before distributing an installable APK.

            > **Debug APK:** Signed with a temporary CI debug key. It can be installed for testing, but cannot update an app signed with a different key.

            Built from tag `${{ inputs.tag_name || github.ref_name }}` at commit `${{ github.sha }}`.
          files: |
            dist/release/lyrics-tool-release-unsigned.apk
            dist/debug/lyrics-tool-debug.apk
          fail_on_unmatched_files: true
          prerelease: ${{ contains(inputs.tag_name || github.ref_name, '-') }}
